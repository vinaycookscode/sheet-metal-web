<div class="gw-pw"
     [class.gw-pw--sm]="size === 'sm'"
     [class.gw-pw--lg]="size === 'lg'"
     [class.gw-pw--invalid]="invalid"
     [class.gw-pw--disabled]="disabled()">
  <input
    class="gw-pw__el"
    [type]="revealed() ? 'text' : 'password'"
    [id]="inputId"
    [placeholder]="placeholder"
    [value]="value()"
    [disabled]="disabled()"
    [autocomplete]="autocomplete"
    [attr.aria-invalid]="invalid || null"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />
  <button type="button" class="gw-pw__toggle"
          [attr.aria-label]="revealed() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="revealed()"
          (click)="toggle()">
    @if (revealed()) {
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-10-7-10-7a17.66 17.66 0 0 1 3.92-5.18M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a17.78 17.78 0 0 1-2.16 3.19"/><path d="M3 3l18 18"/>
      </svg>
    }
  </button>
</div>
@if (showStrength && value()) {
  <div class="gw-pw__strength" [attr.data-score]="strength">
    <div class="gw-pw__bars">
      <span [class.is-on]="strength >= 1"></span>
      <span [class.is-on]="strength >= 2"></span>
      <span [class.is-on]="strength >= 3"></span>
      <span [class.is-on]="strength >= 4"></span>
    </div>
    <span class="gw-pw__strength-label">{{ strengthLabel }}</span>
  </div>
}
