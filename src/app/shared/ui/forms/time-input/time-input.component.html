<div class="gw-datelike"
     [class.gw-datelike--sm]="size === 'sm'"
     [class.gw-datelike--lg]="size === 'lg'"
     [class.gw-datelike--invalid]="invalid"
     [class.gw-datelike--disabled]="disabled()">
  <input
    class="gw-datelike__el"
    type="time"
    [id]="inputId"
    [value]="value()"
    [attr.min]="min"
    [attr.max]="max"
    [attr.step]="step"
    [disabled]="disabled()"
    [attr.aria-invalid]="invalid || null"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />
  <span class="gw-datelike__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
    </svg>
  </span>
</div>
