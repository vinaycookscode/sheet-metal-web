<div class="gw-num"
     [class.gw-num--sm]="size === 'sm'"
     [class.gw-num--lg]="size === 'lg'"
     [class.gw-num--invalid]="invalid"
     [class.gw-num--disabled]="disabled()">
  @if (steppers) {
    <button type="button" class="gw-num__step gw-num__step--minus"
            aria-label="Decrease"
            [disabled]="disabled() || atMin"
            (click)="decrement()">−</button>
  }
  <input
    class="gw-num__el"
    type="number"
    inputmode="numeric"
    [id]="inputId"
    [placeholder]="placeholder"
    [value]="value() ?? ''"
    [attr.min]="min"
    [attr.max]="max"
    [step]="step"
    [disabled]="disabled()"
    [attr.aria-invalid]="invalid || null"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />
  @if (steppers) {
    <button type="button" class="gw-num__step gw-num__step--plus"
            aria-label="Increase"
            [disabled]="disabled() || atMax"
            (click)="increment()">+</button>
  }
</div>
