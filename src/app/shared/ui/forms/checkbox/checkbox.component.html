<label class="gw-checkbox"
       [class.gw-checkbox--checked]="checked()"
       [class.gw-checkbox--indeterminate]="indeterminate && !checked()"
       [class.gw-checkbox--invalid]="invalid"
       [class.gw-checkbox--disabled]="disabled()">
  <input
    class="gw-checkbox__input"
    type="checkbox"
    [id]="inputId"
    [checked]="checked()"
    [disabled]="disabled()"
    [attr.aria-invalid]="invalid || null"
    (change)="handleChange($event)"
  />
  <span class="gw-checkbox__box" aria-hidden="true">
    @if (checked()) {
      <svg viewBox="0 0 14 14" width="14" height="14">
        <path d="M3 7.5l3 3 5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    } @else if (indeterminate) {
      <svg viewBox="0 0 14 14" width="14" height="14">
        <path d="M3 7h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    }
  </span>
  @if (label) { <span class="gw-checkbox__label">{{ label }}</span> }
</label>
