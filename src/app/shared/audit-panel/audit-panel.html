@if (loading()) {
  <p class="audit__muted">Loading history…</p>
} @else if (!lines().length) {
  <p class="audit__muted">No history yet.</p>
} @else {
  <ul class="audit">
    @for (l of lines(); track l.id) {
      <li class="audit__row">
        <span class="audit__dot" [class.audit__dot--crit]="l.critical"></span>
        <p class="audit__text"><strong>{{ l.actor }}</strong> {{ l.text }}</p>
        <span class="audit__time">{{ l.time }}</span>
      </li>
    }
  </ul>
}
